[project]
name = "musikkspelar"
version = "0.2.0"
description = "Ein musikkspelar i terminalen, med spektrumanalysator og albumcover"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jo Bjørnar Hausnes" }]
requires-python = ">=3.11"
keywords = ["music", "player", "terminal", "tui", "textual", "mp3", "flac"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Norwegian",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=8.0",
    "mutagen>=1.47",
    "numpy>=2.0",
    "miniaudio>=1.60",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Valfritt: mpv speler fleire format (M4A, Opus), men krev at mpv er installert på maskina
mpv = ["python-mpv>=1.0"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/hausnes/musikkspelar-terminal"
Issues = "https://github.com/hausnes/musikkspelar-terminal/issues"

[project.scripts]
musikkspelar = "musikkspelar.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["musikkspelar*"]

[tool.setuptools.package-data]
musikkspelar = ["ui/*.tcss"]
