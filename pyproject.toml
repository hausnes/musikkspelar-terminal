[project]
name = "musikkspelar"
version = "0.1.0"
description = "Ein musikkspelar i terminalen"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "python-mpv>=1.0",
    "mutagen>=1.47",
    "numpy>=2.0",
    "miniaudio>=1.60",
]

[project.scripts]
musikkspelar = "musikkspelar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["musikkspelar*"]

[tool.setuptools.package-data]
musikkspelar = ["ui/*.tcss"]
